<style>.pop{opacity:0;animation:pop .9s cubic-bezier(.22,1.4,.36,1) both;transform-box:fill-box;transform-origin:center}@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.8)}to{opacity:1;transform:none}}.shine{animation:shine 7s ease-in-out infinite}@keyframes shine{0%,55%{transform:translateX(-300px)}85%,100%{transform:translateX(1500px)}}.glow{animation:glow 3.2s ease-in-out infinite}@keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pop{opacity:1}}</style>
